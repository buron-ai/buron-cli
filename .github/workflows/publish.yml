name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # `npm install` (not `npm ci`) — see ci.yml for rationale.
      - name: Install
        run: npm install

      # prepublishOnly script in package.json runs typecheck + lint + build,
      # so we don't need to repeat them here. `npm publish` triggers it.
      # Auth is via Trusted Publishing (OIDC) — the `id-token: write`
      # permission above lets npm exchange a GitHub-issued JWT for a
      # publish credential. No NPM_TOKEN secret needed.
      - name: Publish
        run: npm publish --access public --provenance

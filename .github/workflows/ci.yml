name: CI

on:
  pull_request:
  push:
    branches: [main, preview]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # `npm install` (not `npm ci`) so biome's platform-specific
      # optional dependency (@biomejs/cli-linux-x64) gets installed on
      # the linux runner even when package-lock.json was generated on
      # macOS. `npm ci` is stricter and skips optional deps the lock
      # didn't capture, which trips biome.
      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
